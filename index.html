<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><title>Car Manager V2</title><link rel="stylesheet" href="./style.css"></head><body><header><div><h1>🚗 Car Manager</h1><p id="activeName">Aucun véhicule</p></div><button id="newVehicle" class="primary">＋ Véhicule</button></header><main><section class="switcher"><label>Véhicule actif<select id="vehicleSelect"></select></label><button id="editVehicle">Modifier</button></section><nav><button data-view="home" class="active">Accueil</button><button data-view="calendar">Calendrier</button><button data-view="records">Entretiens</button><button data-view="vehicles">Garage</button></nav>
<section id="home" class="view active"><div class="hero"><span>Kilométrage</span><strong id="km">0 km</strong><button id="setKm">Mettre à jour</button></div><div class="stats"><article><span>En retard</span><strong id="late">0</strong></article><article><span>Dans 30 jours</span><strong id="soon">0</strong></article><article><span>Dépenses année</span><strong id="cost">0 €</strong></article><article><span>Coût total</span><strong id="allCost">0 €</strong></article></div><h2>Prochaines échéances</h2><div id="alerts" class="list"></div><button id="quickAdd" class="primary wide">＋ Ajouter un entretien</button></section>
<section id="calendar" class="view"><div class="month"><button id="prev">‹</button><h2 id="monthTitle"></h2><button id="next">›</button></div><div class="week"><b>L</b><b>M</b><b>M</b><b>J</b><b>V</b><b>S</b><b>D</b></div><div id="calendarGrid" class="calendar"></div><div id="monthList" class="list"></div></section>
<section id="records" class="view"><div class="sectionhead"><h2>Entretiens du véhicule</h2><button id="addRecord" class="primary">＋</button></div><div class="filters"><select id="typeFilter"><option value="">Tous les types</option></select><select id="statusFilter"><option value="">Tous les états</option><option value="late">En retard</option><option value="soon">Bientôt</option><option value="ok">À jour</option></select></div><div id="recordList" class="list"></div></section>
<section id="vehicles" class="view"><div class="sectionhead"><h2>Mon garage</h2><button id="addVehicle" class="primary">＋</button></div><div id="vehicleCards" class="garage"></div><div class="panel"><h2>Statistiques globales</h2><div class="stats"><article><span>Véhicules</span><strong id="fleetCount">0</strong></article><article><span>Entretiens</span><strong id="fleetRecords">0</strong></article><article><span>Dépenses totales</span><strong id="fleetCost">0 €</strong></article><article><span>Alertes</span><strong id="fleetAlerts">0</strong></article></div></div><div class="panel"><h2>Sauvegarde</h2><button id="exportData" class="wide">Exporter JSON</button><label class="filebtn">Importer JSON<input id="importData" type="file" accept="application/json"></label><button id="resetData" class="danger wide">Effacer toutes les données</button></div></section></main>
<dialog id="vehicleDialog"><form id="vehicleForm"><div class="dialoghead"><h2>Véhicule</h2><button type="button" class="close">✕</button></div><input name="id" type="hidden"><label>Nom personnalisé<input name="nickname" placeholder="Ma Clio" required></label><div class="two"><label>Marque<input name="brand"></label><label>Modèle<input name="model"></label></div><label>Immatriculation<input name="plate"></label><div class="two"><label>Mise en circulation<input name="firstDate" type="date"></label><label>Kilométrage<input name="km" type="number" min="0"></label></div><label>Énergie<select name="fuel"><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option><option>GPL</option></select></label><div class="actions"><button type="button" id="deleteVehicle" class="danger">Supprimer</button><button class="primary">Enregistrer</button></div></form></dialog>
<dialog id="recordDialog"><form id="recordForm"><div class="dialoghead"><h2>Entretien</h2><button type="button" class="close">✕</button></div><input name="id" type="hidden"><label>Type<select name="type" id="recordType"></select></label><label>Libellé<input name="title" required></label><div class="two"><label>Date effectuée<input name="doneDate" type="date"></label><label>Km effectué<input name="doneKm" type="number" min="0"></label></div><div class="two"><label>Prochaine date<input name="nextDate" type="date"></label><label>Prochain km<input name="nextKm" type="number" min="0"></label></div><div class="two"><label>Coût (€)<input name="cost" type="number" min="0" step=".01"></label><label>Garage<input name="provider"></label></div><label>Notes<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="deleteRecord" class="danger">Supprimer</button><button class="primary">Enregistrer</button></div></form></dialog><div id="toast" class="toast"></div><script src="./app.js"></script></body></html>
