<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Car Manager V2.1</title></head><body><header><div><h1>🚗 Car Manager</h1><p id="activeLabel">Mon véhicule</p></div><button id="addVehicleTop" class="primary" type="button">＋ Véhicule</button></header><main><div class="selector"><label>Véhicule actif<select id="vehicleSelect"></select></label><button id="editVehicle" type="button">Modifier</button></div><nav><button class="active" data-tab="home" type="button">Accueil</button><button data-tab="calendar" type="button">Calendrier</button><button data-tab="records" type="button">Entretiens</button><button data-tab="garage" type="button">Garage</button></nav>
<section id="home" class="tab active"><div class="hero"><span>Kilométrage</span><strong id="currentKm">0 km</strong><button id="updateKm" type="button">Mettre à jour</button></div><div class="stats"><article><small>Retards</small><b id="lateCount">0</b></article><article><small>Bientôt</small><b id="soonCount">0</b></article><article><small>Dépenses année</small><b id="yearCost">0 €</b></article><article><small>Coût total</small><b id="totalCost">0 €</b></article></div><h2>Prochaines échéances</h2><div id="alerts" class="list"></div><button id="quickRecord" class="primary wide" type="button">＋ Ajouter un entretien</button></section>
<section id="calendar" class="tab"><div class="month"><button id="prevMonth" type="button">‹</button><h2 id="monthLabel"></h2><button id="nextMonth" type="button">›</button></div><div class="week"><b>L</b><b>M</b><b>M</b><b>J</b><b>V</b><b>S</b><b>D</b></div><div id="calendarGrid" class="cal"></div><div id="monthEvents" class="list"></div></section>
<section id="records" class="tab"><div class="titlebar"><h2>Entretiens</h2><button id="addRecord" class="primary" type="button">＋</button></div><div class="filters"><select id="typeFilter"><option value="">Tous les types</option></select><select id="statusFilter"><option value="">Tous les états</option><option value="late">En retard</option><option value="soon">Bientôt</option><option value="ok">À jour</option></select></div><div id="recordList" class="list"></div></section>
<section id="garage" class="tab"><div class="titlebar"><h2>Mon garage</h2><button id="addVehicleGarage" class="primary" type="button">＋</button></div><div id="vehicleCards" class="garage"></div><div class="panel"><h2>Statistiques globales</h2><div class="stats"><article><small>Véhicules</small><b id="fleetVehicles">0</b></article><article><small>Entretiens</small><b id="fleetRecords">0</b></article><article><small>Dépenses</small><b id="fleetCost">0 €</b></article><article><small>Alertes</small><b id="fleetAlerts">0</b></article></div></div><div class="panel"><h2>Sauvegarde</h2><button id="exportBtn" class="wide" type="button">Exporter JSON</button><label class="filebtn">Importer JSON<input id="importInput" type="file" accept="application/json"></label><button id="resetBtn" class="danger wide" type="button">Effacer les données</button></div></section></main>
<dialog id="vehicleDialog"><form id="vehicleForm"><div class="dialoghead"><h2>Véhicule</h2><button class="close" type="button">✕</button></div><input name="id" type="hidden"><label>Nom<input name="nickname" required placeholder="Ma Clio"></label><div class="two"><label>Marque<input name="brand"></label><label>Modèle<input name="model"></label></div><label>Immatriculation<input name="plate"></label><div class="two"><label>Mise en circulation<input name="firstDate" type="date"></label><label>Kilométrage<input name="km" type="number" min="0"></label></div><label>Énergie<select name="fuel"><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option><option>GPL</option></select></label><div class="actions"><button id="deleteVehicle" class="danger" type="button">Supprimer</button><button class="primary" type="submit">Enregistrer</button></div></form></dialog>
<dialog id="recordDialog"><form id="recordForm"><div class="dialoghead"><h2>Entretien</h2><button class="close" type="button">✕</button></div><input name="id" type="hidden"><label>Type<select id="recordType" name="type"></select></label><label>Libellé<input name="title" required></label><div class="two"><label>Date effectuée<input name="doneDate" type="date"></label><label>Km effectué<input name="doneKm" type="number" min="0"></label></div><div class="two"><label>Prochaine date<input name="nextDate" type="date"></label><label>Prochain km<input name="nextKm" type="number" min="0"></label></div><div class="two"><label>Coût (€)<input name="cost" type="number" min="0" step=".01"></label><label>Garage<input name="provider"></label></div><label>Notes<textarea name="notes" rows="3"></textarea></label><div class="actions"><button id="deleteRecord" class="danger" type="button">Supprimer</button><button class="primary" type="submit">Enregistrer</button></div></form></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
