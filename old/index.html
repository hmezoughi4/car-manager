<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><title>Car Manager</title><link rel="stylesheet" href="./style.css"></head><body><header><div><h1>🚗 Car Manager</h1><p id="vehicleTitle">Mon véhicule</p></div><button class="iconbtn" id="settingsBtn" aria-label="Réglages">⚙️</button></header><main>
<nav><button data-view="dashboard" class="active">Accueil</button><button data-view="calendar">Calendrier</button><button data-view="records">Entretiens</button><button data-view="vehicle">Véhicule</button></nav>
<section id="dashboard" class="view active"><div class="hero"><div><span>Kilométrage</span><strong id="dashKm">0 km</strong></div><button id="updateKm">Mettre à jour</button></div><h2>Prochaines échéances</h2><div id="alerts" class="cards"></div><div class="stats"><article><span>À faire</span><strong id="dueCount">0</strong></article><article><span>Dans 30 jours</span><strong id="soonCount">0</strong></article><article><span>Dépenses année</span><strong id="yearCost">0 €</strong></article></div><button class="primary wide" id="quickAdd">＋ Ajouter un entretien</button></section>
<section id="calendar" class="view"><div class="monthbar"><button id="prevMonth">‹</button><h2 id="monthLabel"></h2><button id="nextMonth">›</button></div><div class="week"><b>L</b><b>M</b><b>M</b><b>J</b><b>V</b><b>S</b><b>D</b></div><div id="calGrid" class="calendar"></div><h2>Échéances du mois</h2><div id="monthEvents" class="list"></div></section>
<section id="records" class="view"><div class="sectionhead"><h2>Entretiens et échéances</h2><button class="primary" id="addRecord">＋</button></div><div class="filters"><select id="filterType"><option value="">Tous les types</option></select><select id="filterStatus"><option value="">Tous les états</option><option value="late">En retard</option><option value="soon">Bientôt</option><option value="ok">À jour</option></select></div><div id="recordList" class="list"></div></section>
<section id="vehicle" class="view"><form id="vehicleForm" class="panel"><h2>Mon véhicule</h2><label>Marque<input name="brand" placeholder="Renault"></label><label>Modèle<input name="model" placeholder="Clio V"></label><label>Immatriculation<input name="plate" placeholder="AB-123-CD"></label><label>Date de mise en circulation<input name="firstDate" type="date"></label><label>Kilométrage actuel<input name="km" type="number" min="0" step="1"></label><label>Énergie<select name="fuel"><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option><option>GPL</option></select></label><button class="primary wide">Enregistrer</button></form><div class="panel"><h2>Sauvegarde</h2><button id="exportJson" class="wide">Exporter les données</button><label class="filebtn">Importer une sauvegarde<input id="importJson" type="file" accept="application/json"></label><button id="resetData" class="danger wide">Effacer toutes les données</button></div></section></main>
<dialog id="recordDialog"><form id="recordForm" method="dialog"><div class="dialoghead"><h2 id="formTitle">Nouvelle échéance</h2><button type="button" id="closeDialog">✕</button></div><input name="id" type="hidden"><label>Type<select name="type" id="typeSelect"></select></label><label>Libellé<input name="title" required placeholder="Vidange moteur"></label><div class="twocol"><label>Date effectuée<input name="doneDate" type="date"></label><label>Kilométrage effectué<input name="doneKm" type="number" min="0"></label></div><div class="twocol"><label>Prochaine date<input name="nextDate" type="date"></label><label>Prochain kilométrage<input name="nextKm" type="number" min="0"></label></div><div class="twocol"><label>Coût (€)<input name="cost" type="number" min="0" step="0.01"></label><label>Garage / prestataire<input name="provider"></label></div><label>Notes<textarea name="notes" rows="3"></textarea></label><div class="check"><input id="recurring" name="recurring" type="checkbox"><label for="recurring">Recalculer automatiquement la prochaine échéance</label></div><div class="twocol"><label>Intervalle mois<input name="intervalMonths" type="number" min="0"></label><label>Intervalle km<input name="intervalKm" type="number" min="0"></label></div><div class="dialogactions"><button type="button" id="deleteRecord" class="danger">Supprimer</button><button class="primary" value="save">Enregistrer</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div><script src="./app.js"></script></body></html>
